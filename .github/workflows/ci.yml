name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, types, unit tests, model checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-model

  build:
    name: Static export (size and duplicate check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # `build` ends with scripts/check-build.ts: no file over 24 MiB, nothing large shipped twice.
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7
          include-hidden-files: true

  e2e:
    name: End-to-end (functional, then perf alone)
    needs: build
    runs-on: ubuntu-latest
    env:
      PERF_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # The perf project's numbers, kept on every run so trends can be compared.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: test-results/perf/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [checks, e2e]
    # Same-repository pushes and pull requests only: forks never see the secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Deploy skipped - add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (docs/architecture.md, Hosting and CI)."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: out/
      - if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'neural-atlas' }}
            --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.number) }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

  smoke:
    name: Smoke test the deployment
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Headers, isolation, content types, caching, trailing slash and the attention model, live.
      - run: pnpm e2e:hosted
        env:
          HOSTED_URL: ${{ needs.deploy.outputs.url }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
